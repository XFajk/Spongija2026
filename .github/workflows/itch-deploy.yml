# Builds the game and pushes it to itch.io. PRs into stable/playtest only build.
#   push to `stable`   -> channels windows-stable, linux-stable, mac-stable
#   push to `playtest` -> channels windows-playtest, linux-playtest, mac-playtest
#
# Required repo settings (Settings -> Secrets and variables -> Actions):
#   secret   BUTLER_API_KEY  - from https://itch.io/user/settings/api-keys
#   ITCH_USER  (variable or secret) - your itch.io username
#   ITCH_GAME  (variable or secret) - the game's url slug on itch.io

name: Build & deploy to itch.io

on:
  push:
    branches: [stable, playtest]
  # PRs into stable/playtest only build (required status check), they never deploy.
  pull_request:
    branches: [stable, playtest]
  workflow_dispatch:

concurrency:
  group: itch-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  CHANNEL_SUFFIX: ${{ github.ref_name }}

jobs:
  export:
    name: Export ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Windows
            platform: windows
            output: build/windows/The great journey.exe
          - preset: Linux
            platform: linux
            output: build/linux/The great journey.x86_64
          - preset: macOS
            platform: mac
            output: build/mac/The great journey.zip
    steps:
      - uses: actions/checkout@v7

      # LFS objects are cached so repeated builds don't burn LFS bandwidth.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Cache LFS objects
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-

      - name: Pull LFS objects
        run: git lfs pull

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-mono-${{ env.GODOT_VERSION }}

      - name: Install Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip" -O godot.zip
          unzip -q godot.zip -d ~/godot
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "$dest"
          mv templates/* "$dest"

      - name: Export
        run: |
          godot=$(find ~/godot -type f -name 'Godot_v*_mono_linux.x86_64')
          mkdir -p "$(dirname '${{ matrix.output }}')"
          # The C# has to be built before the import and export: without the assembly Godot doesn't know the
          # scripts' exported properties, and the C# node arrays (inventory slots, artefact slots) came out empty
          # in builds. The import runs twice because a fresh project's first headless import can stop before
          # every asset is imported (Terrain3D loads mid-import).
          "$godot" --headless --build-solutions --quit
          "$godot" --headless --import
          "$godot" --headless --import
          "$godot" --headless --export-release "${{ matrix.preset }}" "${{ matrix.output }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: build/${{ matrix.platform }}

  # Godot's built-in signer on Linux produces a hardened-runtime signature that
  # macOS kills at launch, so the app is ad-hoc signed here with Apple's codesign.
  sign-macos:
    name: Sign macOS
    needs: export
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mac
          path: build/mac

      - name: Ad-hoc sign
        run: |
          ditto -x -k "build/mac/The great journey.zip" out
          codesign --force --deep --sign - "out/The great journey.app"
          codesign --verify --deep --strict "out/The great journey.app"

      - name: Smoke test (launch headless)
        run: '"out/The great journey.app/Contents/MacOS/The great journey" --headless --quit-after 120'

      - name: Repackage
        run: |
          mkdir -p build/mac-signed
          ditto -c -k --keepParent "out/The great journey.app" "build/mac-signed/The great journey.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: mac-signed
          path: build/mac-signed

  deploy:
    name: Push to itch.io (${{ github.ref_name }})
    needs: [export, sign-macos]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: build

      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d ~/butler
          chmod +x ~/butler/butler
          echo "$HOME/butler" >> "$GITHUB_PATH"

      - name: Push builds
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: ${{ vars.ITCH_USER || secrets.ITCH_USER }}
          ITCH_GAME: ${{ vars.ITCH_GAME || secrets.ITCH_GAME }}
          VERSION: ${{ github.ref_name }}-${{ github.run_number }}-${{ github.sha }}
        run: |
          if [ -z "$ITCH_USER" ] || [ -z "$ITCH_GAME" ]; then
            echo "::error::ITCH_USER and ITCH_GAME must be set as repo variables or secrets"
            exit 1
          fi
          TARGET="$ITCH_USER/$ITCH_GAME"
          butler push build/windows        "$TARGET:windows-$CHANNEL_SUFFIX" --userversion "$VERSION"
          butler push build/linux          "$TARGET:linux-$CHANNEL_SUFFIX"   --userversion "$VERSION"
          butler push "build/mac-signed/The great journey.zip" "$TARGET:mac-$CHANNEL_SUFFIX" --userversion "$VERSION"
